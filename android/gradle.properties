# Gradle Memory & Performance Settings
# Kotlin compiles INSIDE the Gradle daemon (one JVM instead of two), which avoids
# "Connection to the Kotlin daemon has been unexpectedly lost" on low-RAM machines.
kotlin.compiler.execution.strategy=in-process
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.daemon=true
org.gradle.caching=true

# AndroidX support
android.useAndroidX=true
android.nonTransitiveRClass=true
