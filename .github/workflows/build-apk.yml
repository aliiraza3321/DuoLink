name: Build & Publish APK

# Builds the Android app and attaches it to a "latest" GitHub Release, so the
# installer QR can always point at one stable URL:
#   https://github.com/aliiraza3321/DuoLink/releases/latest/download/DuoLink.apk
#
# Uploading here uses the GitHub API (2 GB per asset), which is why the 25 MB
# browser-upload limit on the Releases page does not apply.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Release signing only when the repo has the keystore secrets configured;
      # otherwise the debug build is published (still installable, just larger).
      - name: Restore signing key
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/keystore/vortex-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=keystore/vortex-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          set -euo pipefail
          cd android
          if [ -f keystore.properties ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Collect APK
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found $APK"
          cp "$APK" DuoLink.apk
          ls -lh DuoLink.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuoLink-APK
          path: DuoLink.apk
          retention-days: 30

      - name: Publish to latest release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: DuoLink for Android (latest)
          body: |
            Latest APK built automatically from the newest commit.

            Permanent link: https://github.com/aliiraza3321/DuoLink/releases/latest/download/DuoLink.apk
          files: DuoLink.apk
          make_latest: true
          fail_on_unmatched_files: true
