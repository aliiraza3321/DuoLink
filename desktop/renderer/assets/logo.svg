<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- DuoLink mark: a PC, a phone and the link between them, drawn as one
       monoline glyph so it stays readable at 16px in the taskbar. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#171c27"/>
      <stop offset="1" stop-color="#0a0d13"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="4"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Monitor -->
    <rect x="176" y="96" width="248" height="162" rx="17" stroke="#eef2f9" stroke-width="15"/>
    <path d="M292 258 v30" stroke="#eef2f9" stroke-width="15"/>
    <path d="M252 288 h80" stroke="#eef2f9" stroke-width="15"/>

    <!-- Phone shown on the monitor -->
    <rect x="326" y="132" width="54" height="98" rx="12" stroke="#5b9bff" stroke-width="12"/>
    <path d="M344 145 h18" stroke="#5b9bff" stroke-width="7"/>
    <path d="M344 218 h18" stroke="#5b9bff" stroke-width="7"/>

    <!-- The phone in your hand sits in front of the monitor: the fill knocks
         the monitor outline out so the two shapes never merge into a blob. -->
    <rect x="96" y="180" width="118" height="216" rx="26" fill="#10141d" stroke="none"/>
    <rect x="104" y="188" width="102" height="200" rx="22" stroke="#eef2f9" stroke-width="15"/>
    <path d="M134 207 h40" stroke="#eef2f9" stroke-width="7"/>
    <path d="M140 369 h28" stroke="#eef2f9" stroke-width="7"/>

    <!-- Chain link, drawn from the standard link glyph so it stays legible -->
    <g transform="translate(286 300) scale(5.6)">
      <path fill="#5b9bff" d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/>
    </g>
  </g>
</svg>
