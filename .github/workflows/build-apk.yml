name: Build & Publish APK

# Builds the Android app and publishes it as its own tagged release:
#   apk-<versionName>-<run number>   e.g. apk-1.1.0-42
#
# Published releases in this repository are immutable, so a build can never
# replace the asset of an older release - every run gets a new tag. The release
# is marked latest and its asset is always named DuoLink.apk, which keeps the
# stable link in the installer QR working:
#   https://github.com/aliiraza3321/DuoLink/releases/latest/download/DuoLink.apk
#
# Uploading here uses the GitHub API (2 GB per asset), which is why the 25 MB
# browser-upload limit on the Releases page does not apply.

on:
  push:
    branches: ["**"]
    # Documentation-only commits don't need a new APK release.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Release signing only when the repo has the keystore secrets configured;
      # otherwise the debug build is published (still installable, just larger).
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # `secrets` cannot be used in an if: expression, so the check happens
          # here: with no key configured the debug build is published instead.
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "No signing key configured - building debug APK"
            exit 0
          fi
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/keystore/vortex-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=keystore/vortex-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Ensure Android SDK 35
        run: |
          set +e
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /tmp/sdk.log 2>&1
          grep -iE "error|warning: Failed|not found" /tmp/sdk.log | head -5
          "$SDKM" --list_installed | grep -E "android-35|build-tools;35" || echo "android-35 still missing"

      - name: Build APK
        run: |
          set -uo pipefail
          cd android
          # The repo is developed on Windows, where the exec bit is not tracked.
          chmod +x gradlew
          if [ -f keystore.properties ]; then
            TASK=assembleRelease
          else
            TASK=assembleDebug
          fi
          set +e
          ./gradlew "$TASK" --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log | tail -80
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "===== gradle failure ====="
            grep -A30 -m1 "What went wrong" ../gradle-build.log || tail -60 ../gradle-build.log
            echo "=========================="
          fi
          exit $STATUS

      - name: Read app version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 'versionName' android/app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Collect APK
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found $APK"
          cp "$APK" DuoLink.apk
          ls -lh DuoLink.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuoLink-APK
          path: DuoLink.apk
          retention-days: 30

      - name: Publish a new tagged release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          # Immutable releases cannot be edited, so every build gets its own tag.
          tag_name: apk-${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: DuoLink ${{ steps.version.outputs.version }} — APK build ${{ github.run_number }}
          body: |
            Android app built automatically from `${{ github.sha }}`
            (${{ github.ref_name }}), version ${{ steps.version.outputs.version }}.

            Stable link that always serves the newest build:
            https://github.com/aliiraza3321/DuoLink/releases/latest/download/DuoLink.apk

            The Windows installer is on the releases page.
          files: DuoLink.apk
          make_latest: true
          fail_on_unmatched_files: true
