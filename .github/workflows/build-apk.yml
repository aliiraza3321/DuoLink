name: Build & Publish APK

# Builds the Android app and attaches it to a "latest" GitHub Release, so the
# installer QR can always point at one stable URL:
#   https://github.com/aliiraza3321/DuoLink/releases/latest/download/DuoLink.apk
#
# Uploading here uses the GitHub API (2 GB per asset), which is why the 25 MB
# browser-upload limit on the Releases page does not apply.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Release signing only when the repo has the keystore secrets configured;
      # otherwise the debug build is published (still installable, just larger).
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # `secrets` cannot be used in an if: expression, so the check happens
          # here: with no key configured the debug build is published instead.
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "No signing key configured - building debug APK"
            exit 0
          fi
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/keystore/vortex-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=keystore/vortex-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Ensure Android SDK 35
        run: |
          set +e
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /tmp/sdk.log 2>&1
          grep -iE "error|warning: Failed|not found" /tmp/sdk.log | head -5
          "$SDKM" --list_installed | grep -E "android-35|build-tools;35" || echo "android-35 still missing"

      - name: Build APK
        run: |
          set -uo pipefail
          cd android
          # The repo is developed on Windows, where the exec bit is not tracked.
          chmod +x gradlew
          if [ -f keystore.properties ]; then
            TASK=assembleRelease
          else
            TASK=assembleDebug
          fi
          set +e
          ./gradlew "$TASK" --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log | tail -80
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            # Surface the real reason on the run page: the raw log needs auth.
            {
              echo '### Gradle failure'"'"'
              echo '```'
              grep -A12 -m1 "What went wrong" ../gradle-build.log || tail -40 ../gradle-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $STATUS

      - name: Collect APK
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found $APK"
          cp "$APK" DuoLink.apk
          ls -lh DuoLink.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuoLink-APK
          path: DuoLink.apk
          retention-days: 30

      - name: Publish to latest release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: DuoLink for Android (latest)
          body: |
            Latest APK built automatically from the newest commit.

            Permanent link: https://github.com/aliiraza3321/DuoLink/releases/latest/download/DuoLink.apk
          files: DuoLink.apk
          make_latest: true
          fail_on_unmatched_files: true
